  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.0
  provider: ^6.1.2
  video_player: ^2.6.0
  chewie: ^1.13.0
  skeletonizer: ^2.1.0+1
  connectivity_plus: ^6.0.3
  flutter_slidable: ^4.0.1
  google_nav_bar: ^5.0.7
  share_plus: ^12.0.1
  syncfusion_flutter_pdfviewer: ^31.1.19
  path_provider: ^2.1.4
  photo_view: ^0.14.0
  cached_network_image: ^3.3.0
  freezed_annotation: ^3.1.0
  riverpod: ^3.0.0
  url_launcher: ^6.3.0
  flutter_spinkit: ^5.2.1
  readmore: ^3.0.0
  comment_tree: ^0.3.0
  flutter_html: ^3.0.0
  flutter_rating_bar: ^4.0.1
  flutter_secure_storage: ^8.1.0
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  package_info_plus: ^8.3.1
  latlong2: ^0.9.0
  table_calendar: ^3.2.0
  flutter_staggered_animations: ^1.1.1
  intl: ^0.20.2
  local_auth: ^2.2.0
  socket_io_client: ^3.1.2
  flutter_chat_ui: ^2.9.1
  fl_chart: ^0.68.0
  dropdown_button2: ^2.3.9
  geocoding: ^4.0.0
  widget_tooltip: ^1.1.4
  google_maps_flutter: ^2.14.0
  webview_flutter: ^4.4.2
  shimmer: ^3.0.0
  file_picker: ^8.0.0
  path: ^1.9.0
  http_parser: ^4.0.2
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  mime: ^2.0.0
  flutter_svg: ^2.0.9
  image_cropper: ^11.0.0
  permission_handler: ^11.3.0
  uuid: ^4.5.1
  iconsax_flutter: ^1.0.1
  animated_text_kit: ^4.2.2
  flutter_webrtc: ^1.2.1
  flutter_image_compress: ^2.4.0
  story_view: ^0.16.5
  signature: ^6.3.0
  csv: ^6.0.0
  pdf: ^3.11.3
  excel: ^4.0.6
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  passive_liveness: ^0.1.1
  flutter_map: ^7.0.2
  open_filex: ^5.0.0
  flutter_markdown_plus: ^1.0.3
  app_settings: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/location.png
    - assets/profile.png
    - assets/no_internet.png
    - assets/chat_pattern.png
    - assets/staff_syncc.png
    - assets/lantern.png
    - assets/promotion.png
    - assets/gifs/
    - assets/models/mobilefacenet.tflite

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

    - family: DM Mono
      fonts:
        - asset: assets/fonts/DMMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMMono-Medium.ttf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "assets/staff_syncc.png"